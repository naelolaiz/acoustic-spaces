# Outdoors: a summer evening concert on a lawn by a lake, its loudspeakers 6 m up,
# heard by the audience 30 m away, from a boat in the middle of the lake and in a
# village on the far shore, 550 m away, in a garden and at a bedroom window. The
# evening breeze blows from the park out over the lake, 2.5 m/s 10 m up, and three
# weathers share the scene: the park's, and two weather zones. Over the water the air
# lies cool, 17 °C at the surface where the park's is at 22 °C, warming by a degree
# every 10 m up, and the breeze, with nothing to slow it on the smooth water, blows at
# 3.5 m/s; among the village's houses and gardens it drops to 1 m/s. The cool air and
# the breeze both bend the sound down to the water, which gives it back almost whole:
# this is why a concert carries across a lake on a summer night, and the far shore
# hears it a few decibels louder than in still air. Show wind and Show wind profile in
# the editor's View menu draw the three weathers.
name: Concert across a lake
geometry:
  ground:
    extent: [[-150, -120], [700, 120]]
    sky: 40
    zones:
      - name: water
        polygon: [[60, -120], [520, -120], [520, 120], [60, 120]]
  buildings:
    - name: house_1
      footprint: [[570, -70], [584, -70], [584, -56], [570, -56]]
      height: 7
    - name: house_2
      footprint: [[570, -24], [586, -24], [586, -8], [570, -8]]
      height: 8
    - name: house_3
      footprint: [[572, 30], [586, 30], [586, 44], [572, 44]]
      height: 7
materials:
  lawn:
    impedance: grass
  lake:
    impedance: water
  rendered:
    absorption: [0.02, 0.02, 0.03, 0.03, 0.04, 0.05, 0.05, 0.05]
    scattering: 0.1
assignments:
  ground: lawn
  water: lake
  walls: rendered
  roofs: rendered
air:
  temperature_c: 22
  humidity_percent: 60
atmosphere:
  wind: {speed_m_s: 2.5, direction_deg: 0}
  zones:
    - name: lake
      polygon: [[60, -120], [520, -120], [520, 120], [60, 120]]
      temperature_c: 17
      temperature_gradient_k_m: 0.1
      roughness_m: 0.0002
      wind: {speed_m_s: 3.5}
    - name: village
      polygon: [[520, -120], [700, -120], [700, 120], [520, 120]]
      roughness_m: 0.5
      wind: {speed_m_s: 1}
# In a demo of the scene (acoustic-spaces demo, or lakeside_demo.py) the stage's sound
# system plays the recording below, downloaded the first time: the stereo mix of
# "Spicy Funk Cake" by the Rhythmussportgruppe (CC BY 4.0), main_left, on the
# audience's left, its left channel, main_right its right one and the subwoofers both
# mixed down; give `recording:` a file of yours to hear that instead.
recording: spicy_funk_cake
sources:
  # One source in the middle of the stage, 120 dB sound power, for a quick look at the
  # weather without the sound system: left out of the scene's simulations until ticked.
  - name: stage
    enabled: false
    channel: mono
    position: [0, 0, 6]
    level_db: 120
  # The stage's sound system, as a lawn concert hangs it: two line arrays
  # of eight boxes (lake_array.yaml, the box's own pattern in box.csv, both made with
  # the stadium example's make_model.py) flown 6.5 m up on the audience's left (-y: the
  # audience looks towards -x) and right, aimed straight down the lawn and, box by box,
  # from 5 degrees down at the last rows, where the lawn meets the water, to 36 at the
  # front rows; and a block of four cardioid subwoofers on the ground under the middle
  # of the stage front, 2 m nearer the audience than the arrays and delayed by as much,
  # so that both arrive together there. Levels are sound power (dB re 1 pW); the arrays
  # play the song's channels, the subwoofers both. The system is tuned at the audience,
  # as a system engineer tunes it (eq_db per octave band, 63 Hz to 8 kHz): the
  # subwoofers rolled off above 125 Hz and 3 dB over the arrays together, the arrays'
  # low mids up and their top octave up by what 30 m of air takes, so that at the
  # audience, in this scene's weather, every octave from 500 Hz to 4 kHz is within
  # 1 dB of 1 kHz, 250 Hz 1.3 dB down, 8 kHz 1.9 dB down and the two lowest 1.8 to
  # 1.9 dB up.
  - name: main_left
    channel: left
    group: PA
    position: [0, -6, 6.5]
    orientation: {yaw: 0}
    level_db: 124
    eq_db: [0, 0, 5, 0, 0, 1, 1, 2]
    directivity: {file: lake_array.yaml, near_field: true}
  - name: main_right
    channel: right
    group: PA
    position: [0, 6, 6.5]
    orientation: {yaw: 0}
    level_db: 124
    eq_db: [0, 0, 5, 0, 0, 1, 1, 2]
    directivity: {file: lake_array.yaml, near_field: true}
  - name: subs
    channel: mono
    group: PA
    position: [1, 0, 0.6]
    level_db: 130
    eq_db: [0, 0, -18, -40, -40, -40, -40, -40]
    delay_ms: 6
    directivity: {file: sub_array.yaml, near_field: true}
listeners:
  - name: audience
    position: [30, 0, 1.5]
    orientation: {yaw: 180}
  - name: boat
    position: [330, -50, 1.5]
    orientation: {yaw: 180}
  - name: garden
    position: [550, 37, 1.5]
    orientation: {yaw: 180}
  - name: bedroom_window
    position: [568, -16, 5]
    orientation: {yaw: 180}
  # Behind the stage, as far upwind as the park reaches.
  - name: behind_stage
    position: [-140, 0, 1.5]
    orientation: {yaw: 0}
# The tour a demo of the scene plays, each stop for phrases of 8 bars of the song: the
# audience, behind the stage, the boat, the garden, and the bedroom window in the
# evening's weather, in still air (the scene without its atmosphere, simulated beside
# it) and in the evening's again, so that the difference the weather makes is heard;
# then back to the audience.
tour:
  - {listener: audience, phrases: 2}
  - {listener: behind_stage, phrases: 1}
  - {listener: boat, phrases: 1}
  - {listener: garden, phrases: 1}
  - {listener: bedroom_window, phrases: 1}
  - {listener: bedroom_window, atmosphere: still, phrases: 1}
  - {listener: bedroom_window, phrases: 1}
  - {listener: audience, phrases: 2}
simulation:
  early: {method: image_sources, max_order: 2, diffraction: none}
  late: {method: stochastic_ray_tracing}
  # The responses run 3.5 s past the latest direct sound, the far shore's, 1.6 s late:
  # outdoors the simulation counts ir_length_s from there (5.2 s in all).
  ir_length_s: 3.5
  seed: 1                 # the same random draws every run, in the weather and in still air
outputs:
  - mono
