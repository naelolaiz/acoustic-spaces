simulation:
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing, rays: 25000}
  ir_length_s: 7.0
outputs:
  - mono
  - binaural
# Coverage map (`acoustic-spaces map`): over the floor of the nave, every 1.5 m.
coverage:
  spacing: 1.5
