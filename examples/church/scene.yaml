    position: [28.0, 3.0, 1.2]
    orientation: {yaw: 0}        # facing the altar
  - name: nave-middle
    position: [18.0, -4.0, 1.2]
  - name: nave-back
    position: [5.0, 2.0, 1.2]
  # The other places the tour visits, with nave-back and nave-middle, left out of the
  # church's simulations until ticked or visited.
  - name: side-aisle
    group: Choir concert
    enabled: false
    position: [13, -6, 1.2]
    orientation: {yaw: 0}
  - name: front-pews
    group: Choir concert
    enabled: false
    position: [26.5, 2.5, 1.2]
    orientation: {yaw: 0}
  - name: conductor
    group: Choir concert
    enabled: false
    position: [29.4, 0, 1.7]
    orientation: {yaw: 0}
  - name: in-the-choir
    group: Choir concert
    enabled: false
    position: [31.8, 0, 1.95]
    orientation: {yaw: 180}
# The tour of a demo of the scene: six places, each cut at a breath of the music, the
# organ's first verse heard under the gallery and from the side, the choir alone from
# the front pews and the conductor, the third verse from among the singers and in the
# pews to the end.
tour:
  - {listener: nave-back, seconds: 11.5}
  - {listener: side-aisle, seconds: 13.5}
  - {listener: front-pews, seconds: 12.5}
  - {listener: conductor, seconds: 13.5}
  - {listener: in-the-choir, seconds: 12.5}
  - {listener: nave-middle, to_end: true}
simulation:
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing, rays: 25000}
  ir_length_s: 7.0
outputs:
  - mono
  - binaural
# Coverage map (`acoustic-spaces map`): over the floor of the nave, every 1.5 m.
coverage:
  spacing: 1.5
