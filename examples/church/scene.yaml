    position: [18.0, -4.0, 1.2]
  - name: nave-back
    position: [5.0, 2.0, 1.2]
  # The other places church_demo.py tours, with nave-back and nave-middle, left out of
  # the church's simulations until ticked.
  - name: side-aisle
    group: Choir concert
    enabled: false
    position: [13, -6, 1.2]
    orientation: {yaw: 0}
  - name: front-pews
    group: Choir concert
    enabled: false
    position: [26.5, 2.5, 1.2]
    orientation: {yaw: 0}
  - name: conductor
    group: Choir concert
