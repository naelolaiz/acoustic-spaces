  # The organ in the gallery over the entrance: each division's pipes stand in two
  # halves, the C side (C, D, E, F#, G#, A#) to the south and the C# side to the north,
  # the manual's at 105 dB of sound power each, the pedal towers' at 102.
  - name: organ_manual_c
    group: Organ pipes
    enabled: false
    position: [1.2, -1.6, 9.5]
    orientation: {yaw: 0}
    level_db: 105
    directivity:
      pattern: [omni, omni, omni, omni, subcardioid, subcardioid, cardioid, cardioid]
  - name: organ_manual_cis
    group: Organ pipes
    enabled: false
