simulation:
  sample_rate: 48000             # the rate of the tracks
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing, rays: 50000}
  ir_length_s: 3.5
outputs:
  - mono
  - binaural
