# The orchestra of an anechoic recording of Beethoven's Symphony No. 8 on the stage of the
# concert hall: 61 sources, one per track, and four seats. The tracks (TU Berlin, CC BY 4.0,
# https://doi.org/10.14279/depositonce-6729.2) are not included: download a movement and
# mix it at a seat with auralize.sh.
name: Beethoven 8 orchestra (concert hall, 61 sources)
geometry:
  file: concert_hall.obj
materials:
  audience:
    preset: audience_upholstered_chairs_1
    scattering: theatre_audience
  stage_floor:
    preset: stage_floor
    scattering: 0.1
  wood_panels:
    preset: wooden_lining
    scattering: 0.2
  plaster:
    preset: plasterboard
    scattering: 0.3   # walls broken up by pilasters and boxes
  ceiling:
    preset: ceiling_plasterboard
    scattering: 0.4   # coffered
assignments:
  audience_floor: audience
  stage_floor: stage_floor
  stage_front: wood_panels
  stage_wall: wood_panels
  rear_wall: wood_panels
  side_walls: plaster
  ceiling: ceiling
# Seating is German (antiphonal): first violins on the conductor's left (low y), seconds
# on the right, cellos and violas behind them, basses at the back left, winds in the
# centre on risers, horns back left, trumpets and timpani back right. The stage runs from
# x = 0 (back wall) to x = 8 (front edge, floor at z = 1); the conductor stands at
# (7.3, 10) and the audience is at +x, so it sees the same sides. Risers (0.3 and 0.6 m)
# only raise the sources; the model has no riser surfaces.
#
# Every source has the same power (the default level_db), so the balance is the one in the
# tracks. Directivities are rough per-octave first-order patterns (63 Hz to 8 kHz) after
# Meyer, "Acoustics and the Performance of Music": near omni at low frequencies, narrowing
# above 1 kHz, most for the brass. Horn bells point back and to the player's right, trumpet
# bells to the hall, oboes and clarinets 30 degrees down, bassoons 45 degrees up, timpani
# up; everyone else faces the conductor. Source names match the track files (comments).
