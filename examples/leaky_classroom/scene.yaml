# A 9 x 7 x 3 m classroom exported from a CAD model with two mistakes that leave it
# open: the window glass in the east wall was left out, and the ceiling stops 3 cm
# short of the north wall. The leak finder shows both:
# `acoustic-spaces validate examples/leaky_classroom/scene.yaml --leaks` prints where
# rays escape, and `acoustic-spaces view examples/leaky_classroom/scene.yaml --leaks`
# draws them. Simulated as it is, the room loses sound through the holes and its
# reverberation is too short.
name: Leaky classroom (a model with two holes)
geometry:
  file: classroom.obj
  units: m
materials:
  linoleum:
    preset: linoleum_on_concrete
    scattering: 0.05
  plaster:
    preset: smooth_brickwork_flush_pointing
    scattering: 0.05
  tiles:
    preset: ceiling_fissured_tile
    scattering: 0.1
assignments:
  floor: linoleum
  ceiling: tiles
  north_wall: plaster
  south_wall: plaster
  east_wall: plaster
  west_wall: plaster
sources:
  - name: teacher
    position: [1.3, 3.4, 1.6]
    orientation: {yaw: 0}
    directivity: cardioid
listeners:
  - name: front row
    position: [3.7, 2.6, 1.2]
    orientation: {yaw: 180}
  - name: back row
    position: [7.4, 4.3, 1.2]
    orientation: {yaw: 180}
simulation:
  ir_length_s: 1.0
outputs:
  - mono
