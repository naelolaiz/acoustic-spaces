# Outdoors: a street 12 m wide between a row of houses 9 m high and an office block
# 15 m high, with traffic along it (a line source 30 m long). Past the end of the houses
# a noise barrier 3 m high shields a garden. The scene is the ground and the open sky
# over it: sound that reaches the sky leaves, and the ground reaches 30 m past the
# buildings, then goes on as if it never ended. One listener stands on the pavement, one
# on a balcony of the office block, one in the garden, where the traffic comes over the
# top of the barrier and round its ends: `first_order` diffraction follows it. A car
# (with its horn, if wanted), a bus, a motorcycle, a police car with its siren on and a
# fire engine with its siren and its air horn drive along the street at 50 km/h, and a
# tram runs down its middle at 50 km/h, their pitch falling as they pass (Doppler):
# they are left out of simulations until ticked, and passby_demo.py plays one. Road
# works in the lane on the houses' side (a breaker on an excavator, a generator, and a
# dumper reversing with its alarm on) are left out too; works_demo.py plays them.
name: Street with a noise barrier
geometry:
  ground: {margin: 30}
  buildings:
    - name: houses
      footprint: [[-30, 6], [10, 6], [10, 16], [-30, 16]]
      height: 9
    - name: offices
      footprint: [[-30, -20], [30, -20], [30, -6], [-30, -6]]
      height: 15
  barriers:
    - name: noise_barrier
      path: [[14, 6], [44, 6]]
      height: 3
materials:
  asphalt:
    preset: concrete_floor
    scattering: 0.05
  brick:
    preset: brickwork
    scattering: 0.2
  concrete:
    preset: rough_concrete
    scattering: 0.1
assignments:
  ground: asphalt
  houses: brick
  offices: concrete
  barriers: concrete
sources:
  - name: traffic
    position: [0, 0, 0.5]
    orientation: {yaw: -90}
    line_m: 30
    spacing_m: 3
    level_db: 100
  # A passenger car in the lane on the offices' side, its sound power per octave band
  # CNOSSOS-EU's at the speed of its trajectory, 50 km/h (Directive 2002/49/EC, Annex II,
  # Appendix F, Table F-1, as amended in 2021), from 0.05 m above the road, where the
  # method places it; a demo plays a sound made to that power, tyre noise and a
  # four-cylinder engine at 2000 rpm. Its horn, a pair of disc horns (360 and 430 Hz,
  # 110 dB(A) 2 m in front of them, as Hella's S77, their tone discs ringing near 3
  # kHz), 0.5 m up, goes along its trajectory facing the way it drives, with the
  # directivity of siren.csv, in two short blasts every 3 s, its sound power their
  # average (passby_demo.py --sources car+car_horn sounds it with the car). Each pass is
  # simulated every metre.
  - name: car
    group: Passenger car
    enabled: false
    position: [-55, -2, 0.05]
    model: {method: cnossos-eu, category: '1', rpm: 2000, cylinders: 4}
    trajectory:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
      step_m: 1
  - name: car_horn
    group: Passenger car
    enabled: false
    position: [-55, -2, 0.5]
    model: {method: horn, kind: disc_horns}
    directivity: {file: siren.csv}
    trajectory:
      to: [[70, -2, 0.5]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  # A city bus with two axles (CNOSSOS-EU's category 2) in the lane on the houses' side,
  # the other way, at 50 km/h; its made sound's engine a six-cylinder diesel at 1500 rpm.
  - name: bus
    enabled: false
    position: [70, 2, 0.05]
    model: {method: cnossos-eu, category: '2', rpm: 1500, cylinders: 6}
    trajectory:
      to: [[-55, 2, 0.05]]
      speed_m_s: 13.89
      doppler: true
      step_m: 1
  # A motorcycle (category 4b, propulsion noise alone) behind where the car goes, at 50
  # km/h; its made sound's engine two cylinders at 4000 rpm.
  - name: motorcycle
    enabled: false
    position: [-55, -2, 0.05]
    model: {method: cnossos-eu, category: 4b, rpm: 4000, cylinders: 2}
    trajectory:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
      step_m: 1
  # A police car with its siren on, in the lane on the houses' side, the other way, at
  # 50 km/h: the car itself, a passenger car, its tyres and engine heard from 0.05 m
  # above the road with CNOSSOS-EU's sound power (as the car's); and its siren, wailing:
  # a 100 W electronic siren on its roof, 1.5 m up, along the same trajectory, facing the
  # way it drives, at the sound power and with the directivity the National Bureau of
  # Standards measured (siren.csv; passby_demo.py --siren picks the pattern, --sources
  # police_car_siren plays the siren alone). The car is some 32 dB(A) under the siren,
  # but under the siren's pitch, in the octaves of 63 to 250 Hz, it is all the police
  # car's sound.
  - name: police_car
    group: Police car
    enabled: false
    position: [70, 2, 0.05]
    model: {method: cnossos-eu, category: '1', rpm: 2000, cylinders: 4}
    trajectory:
      to: [[-55, 2, 0.05]]
      speed_m_s: 13.89
      doppler: true
      step_m: 1
  - name: police_car_siren
    group: Police car
    enabled: false
    position: [70, 2, 1.5]
    model: {method: siren, pattern: wail}
    directivity: {file: siren.csv}
    trajectory:
      to: [[-55, 2, 1.5]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  # A fire engine on a call, in the lane on the offices' side, at 50 km/h: the vehicle
  # itself, a medium heavy vehicle with two axles (CNOSSOS-EU's category 2, as the
  # bus's), 0.05 m above the road; its siren, the two tones of DIN 14610, on its cab's
  # roof, 3.0 m up, 6 dB louder than the police car's, which makes them 115 dB(A) 7 m in
  # front of it, as loud as the Swiss rule lets them be on a vehicle
  # (validation/urban_sources.py); and its air horn, 1.2 m up, in blasts, as loud as the
  # rule for horns lets one be on its bench (118 dB(A) 2 m away). The three go along one
  # trajectory; the siren and the horn face the way it drives, with the directivity of
  # siren.csv (passby_demo.py --sources picks which play).
  - name: fire_engine
    group: Fire engine
    enabled: false
    position: [-55, -2, 0.05]
    model: {method: cnossos-eu, category: '2', rpm: 1500, cylinders: 6}
    trajectory:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
      step_m: 1
  - name: fire_engine_siren
    group: Fire engine
    enabled: false
    position: [-55, -2, 3.0]
    model: {method: siren, pattern: two_tone, patterns: [two_tone], gain_db: 6}
    directivity: {file: siren.csv}
    trajectory:
      to: [[70, -2, 3.0]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  - name: fire_engine_horn
    group: Fire engine
    enabled: false
    position: [-55, -2, 1.2]
    model: {method: horn, kind: air_horn}
    directivity: {file: siren.csv}
    trajectory:
      to: [[70, -2, 1.2]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  # A low-floor tram with air conditioning (30 m long, eight axles) on its track down
  # the middle of the street, at 50 km/h, its front where the sources stand: its
  # sources at the rail top (its bogies) and on its roof (4 m up), Schall 03's
  # (Germany's method for the noise of railways and tramways, 2014) for a track set in
  # the street, with its directivity round the track (tram.csv). The sound power of
  # each is its first point's, its first bogie's and the front of its roof's; the demo
  # plays the points behind them too, each as far behind as it is. Its pass is
  # simulated every metre.
  - name: tram
    group: Tram
    enabled: false
    position: [-55, 0, 0.05]
    model: {method: schall-03, train: tram, track: street}
    directivity: {file: tram.csv}
    trajectory:
      to: [[70, 0, 0.05]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  - name: tram_roof
    group: Tram
    enabled: false
    position: [-55, 0, 4.05]
    model: {method: schall-03, train: tram, track: street, height: roof}
    directivity: {file: tram.csv}
    trajectory:
      to: [[70, 0, 4.05]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
      step_m: 1
  # Road works in the lane on the houses' side, 20 m along from the pavement's
  # listener (the group Road works): a 1650 kg hydraulic breaker on a 15 t excavator
  # breaking up the road, a 6 kVA diesel generator on the pavement and a 9 t dumper
  # reversing to them, its alarm at its back, 1.2 m up, facing the works. Each machine's
  # sound power per octave band is its level 10 m away in Defra's noise database for
  # construction sites (2005, the data of BS 5228-1 Annex C) plus 28 dB; a demo plays a
  # sound made to it, the breaker's blows (480 a minute) and the engines' firing. The
  # alarm is a tonal one at 1200 Hz, 107 dB(A) 1.2 m in front of it (SAE J994 Type B),
  # beeping half the time, with the directivity of siren.csv (works_demo.py plays them).
  - name: breaker
    group: Road works
    enabled: false
    position: [-20, 2, 1.0]
    model: {method: defra, machine: breaker}
  - name: generator
    group: Road works
    enabled: false
    position: [-26, 4.5, 0.5]
    model: {method: defra, machine: generator}
  - name: dumper
    group: Road works
    enabled: false
    position: [-13, 2, 1.5]
    model: {method: defra, machine: dumper}
  - name: dumper_alarm
    group: Road works
    enabled: false
    position: [-14.5, 2, 1.2]
    orientation: {yaw: 180}
    model: {method: sae-j994}
    directivity: {file: siren.csv}
listeners:
  - name: pavement
    position: [0, 4, 1.6]
    orientation: {yaw: -90}
  - name: balcony
    position: [5, -5, 10]
    orientation: {yaw: 90}
  - name: garden
    position: [28, 14, 1.6]
    orientation: {yaw: -90}
  # Where the offices behind the balcony take their level outdoors, 2 m in front of
  # their wall (EN ISO 12354-3), which the road works' demo and the tram's with
  # --indoors simulate.
  - name: balcony_2m
    enabled: false
    position: [5, -4, 10]
    orientation: {yaw: 90}
simulation:
  early: {method: ray_tracing, max_order: 3, diffraction: first_order}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 1.0
outputs:
  - mono
  - binaural
