# Outdoors: a street 12 m wide between a row of houses 9 m high and an office block
# 15 m high, with traffic along it (a line source 30 m long). Past the end of the houses
# a noise barrier 3 m high shields a garden. The scene is the ground and the open sky
# over it: sound that reaches the sky leaves, and the ground reaches 30 m past the
# buildings, then goes on as if it never ended. One listener stands on the pavement, one
# on a balcony of the office block, one in the garden, where the traffic comes over the
# top of the barrier and round its ends: `first_order` diffraction follows it. A car
# (with its horn, if wanted), a bus, a motorcycle, a police car with its siren on and a
# fire engine with its siren and its air horn drive along the street at 50 km/h, and a
# tram runs down its middle at 50 km/h, their pitch falling as they pass (Doppler):
# they are left out of simulations until ticked, and passby_demo.py plays one. Road
# works in the lane on the houses' side (a breaker on an excavator, a generator, and a
# dumper reversing with its alarm on) are left out too; works_demo.py plays them.
name: Street with a noise barrier
geometry:
  ground: {margin: 30}
  buildings:
    - name: houses
      footprint: [[-30, 6], [10, 6], [10, 16], [-30, 16]]
      height: 9
    - name: offices
      footprint: [[-30, -20], [30, -20], [30, -6], [-30, -6]]
      height: 15
  barriers:
    - name: noise_barrier
      path: [[14, 6], [44, 6]]
      height: 3
materials:
  asphalt:
    preset: concrete_floor
    scattering: 0.05
  brick:
    preset: brickwork
    scattering: 0.2
  concrete:
    preset: rough_concrete
    scattering: 0.1
assignments:
  ground: asphalt
  houses: brick
  offices: concrete
  barriers: concrete
sources:
  - name: traffic
    position: [0, 0, 0.5]
    orientation: {yaw: -90}
    line_m: 30
    spacing_m: 3
    level_db: 100
  # A passenger car in the lane on the offices' side, its sound power per octave band
  # CNOSSOS-EU's at 50 km/h (Directive 2002/49/EC, Annex II, Appendix F, Table F-1, as
  # amended in 2021); its sound comes from 0.05 m above the road, where the method
  # places it. Its horn, a pair of disc horns (360 and 430 Hz, 110 dB(A) 2 m in front
  # of them, as Hella's S77, their tone discs ringing near 3 kHz), 0.5 m up, goes along
  # its walk facing the way it drives, with the directivity of siren.csv, in two short
  # blasts every 3 s, its sound power their average (passby_demo.py --car car_and_horn
  # sounds it).
  - name: car
    enabled: false
    position: [-55, -2, 0.05]
    level_db: [98.3, 91.2, 89.4, 90.7, 95.6, 92.3, 84.6, 76.1]
    walk:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  - name: car_horn
    enabled: false
    position: [-55, -2, 0.5]
    level_db: [56.1, 55.7, 68.8, 79.9, 91.5, 104.0, 107.6, 102.7]
    directivity: {file: siren.csv}
    walk:
      to: [[70, -2, 0.5]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  # A city bus with two axles (CNOSSOS-EU's category 2) in the lane on the houses' side,
  # the other way, at 50 km/h.
  - name: bus
    enabled: false
    position: [70, 2, 0.05]
    level_db: [106.1, 99.2, 99.3, 100.2, 101.3, 96.9, 90.1, 84.2]
    walk:
      to: [[-55, 2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  # A motorcycle (category 4b, propulsion noise alone) behind where the car goes, at 50
  # km/h.
  - name: motorcycle
    enabled: false
    position: [-55, -2, 0.05]
    level_db: [99.0, 100.2, 93.3, 91.1, 91.9, 91.1, 88.9, 85.2]
    walk:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  # A police car with its siren on, in the lane on the houses' side, the other way, at
  # 50 km/h: the car itself, a passenger car, its tyres and engine heard from 0.05 m
  # above the road with CNOSSOS-EU's sound power (as the car's); and its siren, wailing:
  # a 100 W electronic siren on its roof, 1.5 m up, along the same walk, facing the way
  # it drives, at the level and with the directivity the National Bureau of Standards
  # measured (siren.csv; passby_demo.py --siren picks the pattern, --police-car siren
  # plays the siren alone). The car is some 32 dB(A) under the siren, but under the
  # siren's pitch, in the octaves of 63 to 250 Hz, it is all the police car's sound.
  - name: police_car
    enabled: false
    position: [70, 2, 0.05]
    level_db: [98.3, 91.2, 89.4, 90.7, 95.6, 92.3, 84.6, 76.1]
    walk:
      to: [[-55, 2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  - name: police_car_siren
    enabled: false
    position: [70, 2, 1.5]
    level_db: [76.1, 76.1, 81.4, 123.3, 128.6, 120.5, 120.0, 118.8]
    directivity: {file: siren.csv}
    walk:
      to: [[-55, 2, 1.5]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  # A fire engine on a call, in the lane on the offices' side, at 50 km/h: the vehicle
  # itself, a medium heavy vehicle with two axles (CNOSSOS-EU's category 2, as the
  # bus's), 0.05 m above the road; its siren, the two tones of DIN 14610, on its cab's
  # roof, 3.0 m up, as loud as the Swiss rule lets them be on a vehicle (115 dB(A) 7 m
  # in front of it); and its air horn, 1.2 m up, in blasts, as loud as the rule for
  # horns lets one be on its bench (118 dB(A) 2 m away). The three go along one walk;
  # the siren and the horn face the way it drives, with the directivity of siren.csv
  # (passby_demo.py --fire-engine picks which play).
  - name: fire_engine
    enabled: false
    position: [-55, -2, 0.05]
    level_db: [106.1, 99.2, 99.3, 100.2, 101.3, 96.9, 90.1, 84.2]
    walk:
      to: [[70, -2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  - name: fire_engine_siren
    enabled: false
    position: [-55, -2, 3.0]
    level_db: [84.0, 84.4, 93.0, 136.1, 121.6, 125.2, 122.3, 121.2]
    directivity: {file: siren.csv}
    walk:
      to: [[70, -2, 3.0]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  - name: fire_engine_horn
    enabled: false
    position: [-55, -2, 1.2]
    level_db: [89.9, 124.1, 121.4, 119.2, 117.7, 114.3, 111.1, 110.3]
    directivity: {file: siren.csv}
    walk:
      to: [[70, -2, 1.2]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  # A low-floor tram with air conditioning (30 m long, eight axles) on its track down
  # the middle of the street, at 50 km/h: the sound power of its front points, at the
  # rail top (its first bogie) and on its roof (4 m up), Schall 03's (Germany's method
  # for the noise of railways and tramways, 2014) for a track set in the street, with
  # its directivity round the track (tram.csv); the pass-by demo plays its other bogies
  # and its roof behind them.
  - name: tram
    enabled: false
    position: [-55, 0, 0.05]
    level_db: [101.5, 101.4, 99.4, 104.0, 107.2, 98.5, 91.7, 83.3]
    directivity: {file: tram.csv}
    walk:
      to: [[70, 0, 0.05]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  - name: tram_roof
    enabled: false
    position: [-55, 0, 4.05]
    level_db: [94.5, 95.4, 91.9, 89.5, 89.3, 87.1, 83.3, 84.4]
    directivity: {file: tram.csv}
    walk:
      to: [[70, 0, 4.05]]
      speed_m_s: 13.89
      face_forward: true
      doppler: true
  # Road works in the lane on the houses' side, 20 m along from the pavement's
  # listener: a 1650 kg hydraulic breaker on a 15 t excavator breaking up the road, a
  # 6 kVA diesel generator on the pavement and a 9 t dumper reversing to them, its
  # alarm at its back, 1.2 m up, facing the works. Each machine's sound power per octave
  # band is its level 10 m away in Defra's noise database for construction sites (2005,
  # the data of BS 5228-1 Annex C) plus 28 dB; the alarm's is a tonal one's at 1200 Hz,
  # 107 dB(A) 1.2 m in front of it (SAE J994 Type B), beeping half the time, with the
  # directivity of siren.csv (works_demo.py plays them).
  - name: breaker
    enabled: false
    position: [-20, 2, 1.0]
    level_db: [116.0, 116.0, 114.0, 117.0, 111.0, 111.0, 108.0, 104.0]
  - name: generator
    enabled: false
    position: [-26, 4.5, 0.5]
    level_db: [105.0, 100.0, 92.0, 88.0, 87.0, 85.0, 82.0, 70.0]
  - name: dumper
    enabled: false
    position: [-13, 2, 1.5]
    level_db: [110.0, 104.0, 103.0, 102.0, 96.0, 96.0, 92.0, 83.0]
  - name: dumper_alarm
    enabled: false
    position: [-14.5, 2, 1.2]
    orientation: {yaw: 180}
    level_db: [48.6, 48.2, 51.6, 56.2, 108.6, 59.9, 44.1, 35.9]
    directivity: {file: siren.csv}
listeners:
  - name: pavement
    position: [0, 4, 1.6]
    orientation: {yaw: -90}
  - name: balcony
    position: [5, -5, 10]
    orientation: {yaw: 90}
  - name: garden
    position: [28, 14, 1.6]
    orientation: {yaw: -90}
simulation:
  early: {method: ray_tracing, max_order: 3, diffraction: first_order}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 1.0
outputs:
  - mono
  - binaural
