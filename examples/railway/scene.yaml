# Outdoors: a railway line on ballast across a meadow, heard where the EU's rule for the
# noise of trains measures one going by (7.5 m from the track's centre, 1.2 m above the
# rail top), 25 m away over the meadow, and 25 m away on the other side behind a noise
# barrier 3 m high, 4 m from the track, which the trains' sound comes over and round
# (`first_order` diffraction follows it). The line source along the track is its traffic
# on average: one regional train an hour at 160 km/h, its sound power per metre Schall
# 03's (Germany's method for the noise of railways, 2014), all of it at the rail top. A
# train runs past at 160 km/h, its pitch falling as it goes by (Doppler): three sources
# along one walk, at the rail top, on the roof and at the pantograph, Schall 03's
# heights; each plays the train's points at that height one behind the other (its
# bogies, its cars' roofs, its pantograph), so the train goes by as long as it is. They
# are left out of simulations until ticked, and passby_demo.py runs one of four trains
# past.
name: Railway across a meadow
geometry:
  ground:
    extent: [[-200, -60], [200, 60]]
    sky: 20
    zones:
      - name: track_bed
        polygon: [[-200, -2], [200, -2], [200, 2], [-200, 2]]
  barriers:
    - name: noise_barrier
      path: [[-100, -4], [100, -4]]
      height: 3
materials:
  meadow:
    impedance: grass
  ballast:
    impedance: gravel
  concrete:
    preset: rough_concrete
    scattering: 0.1
assignments:
  ground: meadow
  track_bed: ballast
  barriers: concrete
sources:
  # The track's traffic on average over an hour: one regional train (an electric
  # locomotive and five coaches) at 160 km/h, Schall 03's sound power per metre of
  # track along 300 m, at the rail top, 0.2 m above the ballast.
  - name: line
    position: [0, 0, 0.2]
    orientation: {yaw: -90}
    line_m: 300
    spacing_m: 10
    level_db: [94.6, 91.7, 91.5, 95.5, 98.8, 97.9, 92.9, 77.8]
  # A regional train at 160 km/h: the sound power of its front point at each height
  # (the locomotive's first bogie, its roof, its pantograph), Schall 03's, with its
  # directivity round the track (train.csv); the demo plays the train's other points
  # behind them.
  - name: train
    enabled: false
    position: [-150, 0, 0.2]
    level_db: [111.2, 108.2, 110.2, 111.9, 114.7, 113.8, 108.8, 93.2]
    directivity: {file: train.csv}
    walk:
      to: [[150, 0, 0.2]]
      speed_m_s: 44.44
      doppler: true
      face_forward: true
  - name: train_roof
    enabled: false
    position: [-150, 0, 4.2]
    level_db: [112.1, 110.2, 114.9, 112.0, 109.0, 106.5, 101.9, 95.8]
    directivity: {file: train.csv}
    walk:
      to: [[150, 0, 4.2]]
      speed_m_s: 44.44
      doppler: true
      face_forward: true
  - name: train_pantograph
    enabled: false
    position: [-150, 0, 5.2]
    level_db: [101.7, 100.6, 101.1, 99.7, 99.5, 100.3, 95.5, 89.6]
    directivity: {file: train.csv}
    walk:
      to: [[150, 0, 5.2]]
      speed_m_s: 44.44
      doppler: true
      face_forward: true
listeners:
  - name: tsi_7m5
    position: [0, 7.5, 1.4]
    orientation: {yaw: -90}
  - name: meadow_25m
    position: [0, 25, 1.5]
    orientation: {yaw: -90}
  - name: behind_barrier_25m
    position: [0, -25, 1.5]
    orientation: {yaw: 90}
simulation:
  early: {method: image_sources, max_order: 1, diffraction: first_order}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 0.5
outputs:
  - mono
