# An L-shaped gallery, 4 m high (1150 m3), with a marble floor, rough brick walls and
# an absorbing ceiling: a guide talks in the long arm, and visitors round the corner hear
# them only by the sound that bends round it (edge diffraction) and by reflections. The
# plan's corners go round the floor; wall_3 and wall_4 meet at the inner corner (8, 8).
# One visitor sees the guide, one stands round the corner, one walks from 3 m in front of
# the guide down the long arm and round the corner at 1.2 m/s, and one stands 4 m from the
# guide and turns their head a quarter at a time: the demo of the scene (`acoustic-spaces
# demo`, or walk_demo.py with the walker and the one turning alone) plays the guide's talk
# as each hears it. Turn a trajectory off (Moving, or `enabled: false`) and that visitor
# stands where they start, facing as they do there.
name: Gallery (L-shaped, 1150 m3)
geometry:
  floor_plan: [[0, 0], [24, 0], [24, 8], [8, 8], [8, 20], [0, 20]]
  height: 4
materials:
  marble:
    preset: marble_floor
    scattering: 0.05
  brick:
    preset: brick_wall_rough
    scattering: 0.2
  ceiling:
    preset: acoustical_plaster_25mm
    scattering: 0.1
assignments:
  floor: marble
  ceiling: ceiling
  walls: brick
# In a demo of the scene (acoustic-spaces demo) the guide says what the recording
# below says, downloaded the first time: the ACE corpus's talker M4 (CC BY 4.0).
# The guide speaks at normal effort (vocal_effort), 60 dB(A) 1 m in front (ISO 9921),
# its sound power per band set from that through its directivity.
recording: ace_m4
sources:
  - name: guide
    vocal_effort: normal
    channel: mono
    position: [20.0, 4.0, 1.6]
    orientation: {yaw: 180}
    directivity: cardioid
    spectrum: speech_male
listeners:
  - name: in sight
    position: [12.0, 5.0, 1.6]
    orientation: {yaw: 0}
  - name: round the corner
    position: [4.0, 15.0, 1.6]
    orientation: {yaw: -60}
  - name: visitor
    position: [17.0, 4.0, 1.6]
    trajectory:
      to: [[4.0, 4.0, 1.6], [4.0, 16.0, 1.6]]
      speed_m_s: 1.2
  # 4 m from the guide and facing them, a visitor turns their head left a quarter at a
  # time, holding each for 4 s, round to the front again: the guide moves to their right
  # ear, behind them and to their left ear (heard through the head tracker binaurally).
  - name: standing
    position: [16, 4, 1.6]
    orientation: {yaw: 0}
    trajectory:
      keyframes:
        - {time_s: 4, position: [16, 4, 1.6], orientation: {yaw: 0}}
        - {time_s: 10, position: [16, 4, 1.6], orientation: {yaw: 90}}
        - {time_s: 14, position: [16, 4, 1.6], orientation: {yaw: 90}}
        - {time_s: 20, position: [16, 4, 1.6], orientation: {yaw: 180}}
        - {time_s: 24, position: [16, 4, 1.6], orientation: {yaw: 180}}
        - {time_s: 30, position: [16, 4, 1.6], orientation: {yaw: 270}}
        - {time_s: 34, position: [16, 4, 1.6], orientation: {yaw: 270}}
        - {time_s: 40, position: [16, 4, 1.6], orientation: {yaw: 360}}
simulation:
  early: {method: ray_tracing, max_order: 3, diffraction: first_order}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 3.0
outputs:
  - binaural
  - mono
# Coverage map (`acoustic-spaces map`): over the floor, with the hum of the building.
coverage:
  noise_db: [45, 40, 35, 30, 25, 20, 15, 10]
