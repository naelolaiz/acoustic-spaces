# A fan-shaped lecture hall built from its floor plan, no CAD file needed.
# The plan's corners go round the floor; wall_1 is the stage wall, from (0, -4) to
# (0, 4), and the side walls open out to the back wall, 16 m wide and 14 m away.
name: Lecture hall (fan-shaped, 168 m2)
geometry:
  floor_plan: [[0, -4], [0, 4], [14, 8], [14, -8]]
  height: 6
materials:
  plaster:
    preset: ceiling_plasterboard
    scattering: 0.1
  wood:
    preset: wooden_lining
    scattering: 0.15
  audience:
    preset: audience_wooden_chairs_1_m2
    scattering: 0.7
  concrete:
    preset: smooth_brickwork_flush_pointing
    scattering: 0.1
assignments:
  floor: audience
  ceiling: plaster
  wall_1: wood       # stage wall
  walls: concrete    # the side and back walls
# In a demo of the scene (acoustic-spaces demo) the lecturer says what the recording
# below says, downloaded the first time: the ACE corpus's talker M4 (CC BY 4.0).
# The lecturer speaks at normal effort, 60 dB(A) 1 m in front (IEC 60268-16), which
# with a man's speech spectrum and a cardioid pattern is 73.3 dB of sound power.
recording: speech_male
sources:
  - name: lecturer
    level_db: 73.3
    spectrum: speech_male
    channel: mono
    position: [1.5, 0.0, 1.6]
    directivity: cardioid
listeners:
  - name: front
    position: [4.0, 1.0, 1.2]
    orientation: {yaw: 180}
  - name: back
    position: [12.0, -3.0, 1.2]
    orientation: {yaw: 165}
simulation:
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 2.0
outputs:
  - mono
  - binaural
# Coverage map (`acoustic-spaces map`): over the floor, with ventilation noise for the STI.
coverage:
  noise_db: [50, 45, 40, 35, 30, 25, 20, 15]
