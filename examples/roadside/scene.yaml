# Outdoors: traffic on a road between a meadow and a paved yard, heard 7.5, 25 and 50 m
# away over the grass, and 25 m away over the yard. Over soft ground the sound that
# reflects off it arrives out of step with the direct sound at a few hundred hertz and
# takes some of it away (the ground dip); over the hard yard the two add up there
# instead, and the dip comes higher up, near 2 kHz. The meadow, the road and the yard
# are parts of the ground, each with its impedance; a reflection near where two meet
# takes some of each, as much as each covers of its Fresnel zone. A car at 50 km/h and
# a truck at 70 km/h drive along the road, their pitch falling as they pass (Doppler):
# they are left out of simulations until ticked, and passby_demo.py plays one.
name: Road across a meadow
geometry:
  ground:
    extent: [[-80, -40], [80, 70]]
    sky: 20
    zones:
      - name: road
        polygon: [[-80, -4], [80, -4], [80, 4], [-80, 4]]
      - name: yard
        polygon: [[-80, -40], [80, -40], [80, -4], [-80, -4]]
materials:
  meadow:
    impedance: grass
  asphalt:
    impedance: asphalt
assignments:
  ground: meadow
  road: asphalt
  yard: asphalt
sources:
  - name: traffic
    position: [0, 0, 0.5]
    orientation: {yaw: -90}
    line_m: 100
    spacing_m: 5
    level_db: 100
  # A passenger car in the lane on the meadow's side, its sound power per octave band
  # CNOSSOS-EU's at 50 km/h (Directive 2002/49/EC, Annex II, Appendix F, Table F-1, as
  # amended in 2021); its sound comes from 0.05 m above the road, where the method
  # places it.
  - name: car
    enabled: false
    position: [75, 2, 0.05]
    level_db: [98.3, 91.2, 89.4, 90.7, 95.6, 92.3, 84.6, 76.1]
    walk:
      to: [[-75, 2, 0.05]]
      speed_m_s: 13.89
      doppler: true
  # An articulated truck (CNOSSOS-EU's category 3, three axles or more) in the lane on
  # the yard's side, the other way, its sound power the method's at 70 km/h.
  - name: truck
    enabled: false
    position: [-75, -2, 0.05]
    level_db: [108.9, 104.8, 104.6, 107.0, 107.0, 101.5, 95.7, 89.7]
    walk:
      to: [[75, -2, 0.05]]
      speed_m_s: 19.44
      doppler: true
listeners:
  - name: verge
    position: [0, 7.5, 1.5]
    orientation: {yaw: -90}
  - name: meadow_25m
    position: [0, 25, 1.5]
    orientation: {yaw: -90}
  - name: meadow_50m
    position: [0, 50, 1.5]
    orientation: {yaw: -90}
  - name: yard_25m
    position: [0, -25, 1.5]
    orientation: {yaw: 90}
simulation:
  early: {method: image_sources, max_order: 1, diffraction: none}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 0.5
outputs:
  - mono
