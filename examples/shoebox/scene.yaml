# A plain rectangular room, the simplest case every method must get right.
name: Shoebox 8 x 6 x 3 m
geometry:
  file: shoebox.obj
  units: m
materials:
  # Absorption per octave band at 63, 125, 250, 500, 1000, 2000, 4000, 8000 Hz.
  painted_concrete:
    absorption: [0.01, 0.01, 0.01, 0.02, 0.02, 0.02, 0.03, 0.03]
    scattering: 0.05
    source: placeholder values, replace with database entries in M1
  carpet_on_concrete:
    absorption: [0.02, 0.02, 0.06, 0.14, 0.37, 0.60, 0.65, 0.65]
    scattering: 0.1
    source: placeholder values, replace with database entries in M1
  acoustic_ceiling:
    absorption: [0.30, 0.40, 0.60, 0.70, 0.75, 0.75, 0.75, 0.75]
    scattering: 0.2
    source: placeholder values, replace with database entries in M1
assignments:
  walls: painted_concrete
  floor: carpet_on_concrete
  ceiling: acoustic_ceiling
sources:
  - name: talker
    position: [2.0, 3.0, 1.5]
    orientation: {yaw: 0, pitch: 0, roll: 0}
    directivity: omni
listeners:
  - name: seat-a
    position: [6.0, 3.0, 1.2]
    orientation: {yaw: 180, pitch: 0, roll: 0}
air:
  temperature_c: 20
  humidity_percent: 50
simulation:
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 1.5
