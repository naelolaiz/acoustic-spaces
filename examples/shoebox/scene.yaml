# A plain rectangular room, the simplest case every method must get right.
# Its absorption sits on the ceiling and the carpet while the walls are hard and smooth,
# so sound running between the walls dies away slowly: the simulated T30 is several times
# the Sabine and Eyring estimates of `inspect`, which assume a diffuse field.
name: Shoebox 8 x 6 x 3 m
geometry:
  file: shoebox.obj
  units: m
materials:
  # Built-in database entries; `acoustic-spaces materials` lists them all.
  # Explicit lists (one value per octave band, 63 Hz to 8 kHz, or per third-octave
  # band, 50 Hz to 10 kHz) override a preset.
  painted_concrete:
    preset: smooth_brickwork_flush_pointing
    scattering: 0.05
  carpet_on_concrete:
    preset: carpet_6mm_closed_cell_foam
    scattering: 0.1
  acoustic_ceiling:
    preset: ceiling_fissured_tile
    scattering: 0.2
assignments:
  walls: painted_concrete
  floor: carpet_on_concrete
  ceiling: acoustic_ceiling
# In a demo of the scene (acoustic-spaces demo) the talker says what the recording
# below says, downloaded the first time: the ACE corpus's talker M4 (CC BY 4.0).
# The talker speaks at normal effort, 60 dB(A) 1 m in front (IEC 60268-16), which
# with a man's speech spectrum and no directivity (omni) is 78.0 dB of sound power.
recording: speech_male
sources:
  - name: talker
    level_db: 78.0
    spectrum: speech_male
    channel: mono
    position: [2.0, 3.0, 1.5]
    orientation: {yaw: 0, pitch: 0, roll: 0}
    directivity: omni
listeners:
  - name: seat-a
    position: [6.0, 3.0, 1.2]
    orientation: {yaw: 180, pitch: 0, roll: 0}
air:
  temperature_c: 20
  humidity_percent: 50
simulation:
  early: {method: ray_tracing, max_order: 3}
  late: {method: stochastic_ray_tracing}
  ir_length_s: 2.5
# Formats the simulate command writes; see "Spatial outputs" in docs/spatial-audio.md.
outputs:
  - mono
  - binaural
  - {format: ambisonics, order: 3}
  - {format: loudspeakers, layout: "5.0"}
