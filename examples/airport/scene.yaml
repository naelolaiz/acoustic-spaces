# Outdoors: an aerodrome's runway across a meadow, and Doc 29's hypothetical twin jet JETW
# (ECAC Doc 29, Volume 3) taking off and landing on it, heard 1.2 m above the grass under
# its departure 4 km from its start of roll, beside the runway 450 m from its centre line
# (on the line along which an aircraft's noise certification measures its take-off from
# the side, ICAO Annex 16), and under its approach 2 km before the threshold (where the
# certification measures its approach). Each flies its procedure as Doc 29 does (its
# heights, speeds and thrust, Appendix B), its pitch falling as it passes (Doppler), with
# the sound power its NPD curves give at its highest thrust and its engines'
# installation as directivity. The example's own simulation hears the departure at its
# start of roll, at take-off thrust; the arrival, as loud as its reverse thrust after
# touchdown, is left out until ticked. flight_demo.py flies either past the listeners.
name: Aerodrome by a meadow
geometry:
  ground:
    extent: [[-4500, -1000], [7000, 1000]]
    sky: 900
    zones:
      - name: runway
        polygon: [[0, -22.5], [3000, -22.5], [3000, 22.5], [0, 22.5]]
materials:
  meadow:
    impedance: grass
  asphalt:
    impedance: asphalt
assignments:
  ground: meadow
  runway: asphalt
air: {temperature_c: 15, humidity_percent: 70}
sources:
