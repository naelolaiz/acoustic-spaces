name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the command line
        shell: bash  # stops at the first failing command on every platform
        run: |
          acoustic-spaces info
          acoustic-spaces validate examples/shoebox/scene.yaml
          acoustic-spaces inspect examples/shoebox/scene.yaml
          acoustic-spaces simulate examples/shoebox/scene.yaml --out sim --rays 5000 --length 0.8 --seed 1
          acoustic-spaces sweep sweep.wav --duration 2 --silence 1 --repeats 2
          python examples/measurement/virtual_recording.py sweep.wav sim/talker__seat-a.wav rec.wav
          acoustic-spaces deconvolve rec.wav --sweep sweep.json --out ir.wav --loopback 2
          acoustic-spaces analyze ir.wav --reference-energy 0.01
          acoustic-spaces convolve sweep.wav sim/talker__seat-a.binaural.wav --out wet.wav
          acoustic-spaces auralize sim talker=sweep.wav --format ambix3 --out mix.wav --normalize

  viz:
    name: 3D view (off-screen)
    runs-on: ubuntu-24.04
    env:
      # Render through OSMesa directly instead of trying (and warning about) an X display.
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install off-screen OpenGL
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libegl1 libgl1 libxrender1
      - name: Build and install
        run: python -m pip install ".[test,viz]"
      - name: Test
        run: python -m pytest -q tests/test_viz.py
      - name: Render the example scene
        run: |
          acoustic-spaces view examples/shoebox/scene.yaml --screenshot shoebox.png
          acoustic-spaces view examples/shoebox/scene.yaml --paths --max-order 2 --screenshot paths.png
          acoustic-spaces simulate examples/shoebox/scene.yaml --out sim --plot --seed 1
          acoustic-spaces sweep sweep.wav --duration 4 --silence 3 --repeats 2
          python examples/measurement/virtual_recording.py sweep.wav sim/talker__seat-a.wav rec.wav --noise-db -70
          acoustic-spaces deconvolve rec.wav --sweep sweep.json --out ir.wav --loopback 2
          acoustic-spaces analyze ir.wav --reference-energy 0.01 --plot ir.png
      - uses: actions/upload-artifact@v6
        with:
          name: scene-view
          path: |
            shoebox.png
            paths.png
            ir.png
            sim/

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cibuildwheel==4.3.1
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Pull requests build one CPython per platform; tags build the full set from pyproject.toml.
          CIBW_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && 'cp310-* cp311-* cp312-* cp313-*' || 'cp313-*' }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
