[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "acoustic-spaces"
dynamic = ["version"]
description = "Open-source room acoustics simulator: geometric acoustics, spatial impulse responses and auralisation"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "acoustic_spaces contributors" }]
keywords = ["acoustics", "room acoustics", "ray tracing", "auralization", "ambisonics", "binaural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ezdxf>=1.1",
    "numpy>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pyvista>=0.43"]
measure = ["sounddevice>=0.4"]
gui = ["PySide6-Essentials>=6.6", "pyvistaqt>=0.11", "pyvista>=0.43", "matplotlib>=3.6"]
sofa = ["h5py>=3.8"]
test = ["pytest>=7", "h5py>=3.8"]
dev = ["pytest>=7", "h5py>=3.8", "ruff>=0.6"]
docs = ["sphinx>=7.2", "furo>=2024.1", "myst-parser>=3"]

[project.scripts]
acoustic-spaces = "acoustic_spaces.cli:main"

[project.gui-scripts]
acoustic-spaces-editor = "acoustic_spaces.gui:main"

[project.urls]
Repository = "https://github.com/naelolaiz/acoustic_spaces_simulator"
Changelog = "https://github.com/naelolaiz/acoustic_spaces_simulator/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/acoustic_spaces"]
sdist.exclude = ["docs/_build", "validation/results"]

[tool.scikit-build.metadata.version]
# The version lives in one place, src/acoustic_spaces/_version.py.
provider = "scikit_build_core.metadata.regex"
input = "src/acoustic_spaces/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["render: draws with OpenGL, so needs a display or off-screen rendering"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest", "h5py"]
test-sources = ["tests", "examples"]
test-command = "pytest -q tests"

[tool.cibuildwheel.windows]
# delvewheel bundles the first msvcp140.dll it finds on PATH; on GitHub's Windows runners
# that is an older copy shipped with Java. Search the system's VC++ runtime first.
repair-wheel-command = 'delvewheel repair --add-path C:\Windows\System32 -w {dest_dir} -v {wheel}'
