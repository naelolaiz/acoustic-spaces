[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4", "hatch-fancy-pypi-readme>=22.3"]
build-backend = "scikit_build_core.build"

[project]
name = "acoustic-spaces"
dynamic = ["version", "readme"]
description = "Open-source room acoustics simulator: geometric acoustics, spatial impulse responses and auralisation"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "acoustic_spaces contributors" }]
keywords = ["acoustics", "room acoustics", "ray tracing", "auralization", "ambisonics", "binaural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ezdxf>=1.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pyvista>=0.43", "imageio>=2.31", "imageio-ffmpeg>=0.5"]
measure = ["sounddevice>=0.4"]
gui = ["PySide6-Essentials>=6.6", "pyvistaqt>=0.11", "pyvista>=0.43", "matplotlib>=3.6"]
sofa = ["h5py>=3.8"]
sketchup = ["openskp>=1.3"]
ifc = ["ifcopenshell>=0.8", "mapbox-earcut>=1.0"]
gpu = ["wgpu>=0.31"]
test = ["pytest>=7", "h5py>=3.8"]
dev = ["pytest>=7", "h5py>=3.8", "ruff>=0.6", "mypy>=2.4", "types-PyYAML>=6.0"]
docs = ["sphinx>=7.2", "furo>=2024.1", "myst-parser>=3"]

[project.scripts]
acoustic-spaces = "acoustic_spaces.cli:main"

[project.gui-scripts]
acoustic-spaces-editor = "acoustic_spaces.gui:main"

[project.urls]
Repository = "https://github.com/naelolaiz/acoustic-spaces"
Changelog = "https://github.com/naelolaiz/acoustic-spaces/blob/main/CHANGELOG.md"

# What `uv sync` installs along with the package in a source checkout; for pip, the
# `dev` extra holds the same.
[dependency-groups]
dev = ["pytest>=7", "h5py>=3.8", "ruff>=0.6", "mypy>=2.4", "types-PyYAML>=6.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/acoustic_spaces"]
sdist.exclude = ["docs/_build", "validation/results"]

[tool.scikit-build.metadata.version]
# The version lives in one place, src/acoustic_spaces/_version.py.
provider = "scikit_build_core.metadata.regex"
input = "src/acoustic_spaces/_version.py"

# The description on PyPI is the README, with its links to the documentation and its
# picture pointing at GitHub, as PyPI cannot follow the README's relative links.
[tool.scikit-build.metadata.readme]
provider = "scikit_build_core.metadata.fancy_pypi_readme"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(docs/images/'
replacement = '](https://raw.githubusercontent.com/naelolaiz/acoustic-spaces/main/docs/images/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(docs/'
replacement = '](https://github.com/naelolaiz/acoustic-spaces/blob/main/docs/'

[tool.uv]
# Rebuild the compiled core on `uv sync` when the C++ sources or the build files change,
# not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*" },
    { file = "src/acoustic_spaces/_version.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["render: draws with OpenGL, so needs a display or off-screen rendering"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
# The type check CI runs (`mypy`, with the dependencies and types-PyYAML installed).
files = ["src/acoustic_spaces"]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional extras and libraries that carry no types.
module = [
    "h5py",
    "ifcopenshell.*",
    "matplotlib.*",
    "PySide6.*",
    "pyvista",
    "pyvistaqt",
    "scipy.*",
    "sounddevice",
    "vtkmodules.*",
    "wgpu",
    "wgpu.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Modules that did not pass when the check began (M21 of the code review of 25 October
# 2026). Each leaves this list once it passes; new modules are checked from the start.
module = [
    "acoustic_spaces",
    "acoustic_spaces.calibration",
    "acoustic_spaces.cli",
    "acoustic_spaces.compare",
    "acoustic_spaces.demos",
    "acoustic_spaces.demos.audio",
    "acoustic_spaces.demos.passby",
    "acoustic_spaces.demos.passby_pictures",
    "acoustic_spaces.demos.pictures",
    "acoustic_spaces.demos.pipeline",
    "acoustic_spaces.demos.scene_demo",
    "acoustic_spaces.demos.scene_pictures",
    "acoustic_spaces.directivity",
    "acoustic_spaces.engine.coherent",
    "acoustic_spaces.engine.coverage",
    "acoustic_spaces.engine.crests",
    "acoustic_spaces.engine.diffraction",
    "acoustic_spaces.engine.early",
    "acoustic_spaces.engine.edge_fade",
    "acoustic_spaces.engine.gpu_rays",
    "acoustic_spaces.engine.gpu_tracer",
    "acoustic_spaces.engine.insertion",
    "acoustic_spaces.engine.late",
    "acoustic_spaces.engine.leaks",
    "acoustic_spaces.engine.long_term",
    "acoustic_spaces.engine.model",
    "acoustic_spaces.engine.ray_device",
    "acoustic_spaces.engine.refracted",
    "acoustic_spaces.engine.refraction",
    "acoustic_spaces.engine.reweight",
    "acoustic_spaces.engine.run_size",
    "acoustic_spaces.engine.shadow",
    "acoustic_spaces.engine.simulate",
    "acoustic_spaces.engine.terrain",
    "acoustic_spaces.engine.tuning",
    "acoustic_spaces.engine.turbulence",
    "acoustic_spaces.engine.vegetation",
    "acoustic_spaces.engine.wave",
    "acoustic_spaces.engine.wide_angle",
    "acoustic_spaces.fetch",
    "acoustic_spaces.geometry.builders",
    "acoustic_spaces.geometry.cells",
    "acoustic_spaces.geometry.checks",
    "acoustic_spaces.geometry.io",
    "acoustic_spaces.geometry.outdoor",
    "acoustic_spaces.geometry.terrain",
    "acoustic_spaces.gltf",
    "acoustic_spaces.gui.app",
    "acoustic_spaces.gui.demo_dialog",
    "acoustic_spaces.gui.document",
    "acoustic_spaces.gui.inspector",
    "acoustic_spaces.gui.movement",
    "acoustic_spaces.gui.plan_view",
    "acoustic_spaces.gui.results_view",
    "acoustic_spaces.gui.tree",
    "acoustic_spaces.gui.viewport",
    "acoustic_spaces.gui.worker",
    "acoustic_spaces.headtracking",
    "acoustic_spaces.i18n",
    "acoustic_spaces.materials.bands",
    "acoustic_spaces.pack",
    "acoustic_spaces.parameters",
    "acoustic_spaces.render",
    "acoustic_spaces.room",
    "acoustic_spaces.scene.model",
    "acoustic_spaces.spatial.loudspeakers",
    "acoustic_spaces.spatial.render",
    "acoustic_spaces.synthesis",
    "acoustic_spaces.viz",
    "acoustic_spaces.walkthrough",
]
ignore_errors = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest", "h5py"]
test-sources = ["tests", "examples", "validation"]
test-command = "pytest -q tests"

[[tool.cibuildwheel.overrides]]
# CPython 3.10 to 3.13 for Intel Macs target macOS 10.9, where nanobind's aligned new and
# delete are missing (they came with 10.13); 3.14 targets 10.15. All Intel Mac wheels
# target 10.15.
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# delvewheel bundles the first msvcp140.dll it finds on PATH; on GitHub's Windows runners
# that is an older copy shipped with Java. Search the system's VC++ runtime first.
repair-wheel-command = 'delvewheel repair --add-path C:\Windows\System32 -w {dest_dir} -v {wheel}'
