[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "acoustic-spaces"
version = "0.1.0.dev0"
description = "Open-source room acoustics simulator: geometric acoustics, spatial impulse responses and auralisation"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "acoustic_spaces contributors" }]
keywords = ["acoustics", "room acoustics", "ray tracing", "auralization", "ambisonics", "binaural"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ezdxf>=1.1",
    "numpy>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pyvista>=0.43"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
acoustic-spaces = "acoustic_spaces.cli:main"

[project.urls]
Repository = "https://github.com/naelolaiz/acoustic_spaces_simulator"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/acoustic_spaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["render: draws with OpenGL, so needs a display or off-screen rendering"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest"]
test-sources = ["tests", "examples"]
test-command = "pytest -q tests"

[tool.cibuildwheel.windows]
# delvewheel bundles the first msvcp140.dll it finds on PATH; on GitHub's Windows runners
# that is an older copy shipped with Java. Search the system's VC++ runtime first.
repair-wheel-command = 'delvewheel repair --add-path C:\Windows\System32 -w {dest_dir} -v {wheel}'
